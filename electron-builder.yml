# A5 — packaging config. Verified with: `electron-builder --linux dir` (see README.md).
# Kept minimal and honest: no signing, no publish targets.
# AppImage needs extra tooling (appimage-builder/fuse) that this sandbox does not have; the
# executables are produced as an unpacked directory instead (`--linux dir`).
appId: dev.firefly.studio
productName: Firefly Studio
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # typescript resolves its default libs from node_modules/typescript/lib/*.d.ts. electron-builder
  # appends its default ignore list after these patterns, and that list ends with
  # `!**/*.{...,d.ts,...}` (app-builder-lib/out/fileMatcher.js), so typescript ships with zero lib
  # files: TS falls back to an empty default lib, identifiers inside inferred object literals degrade
  # to `unknown`, and the wizard then reports editable fields as readOnly (profileConfig.links).
  # A dedicated file set re-adds those .d.ts files inside the asar (verified: 0 -> 102).
  - from: node_modules/typescript/lib
    to: node_modules/typescript/lib
    filter:
      - '**/*'
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target:
    - dir
    - AppImage
  # AppArmor-free desktop integration:
  # - icon: build/icons/{512,256,128,64,48,32}x*.png (electron-builder scales from these)
  # - executableName keeps the binary name stable -> WM_CLASS / app_id == firefly-studio
  # - syncDesktopName makes Electron report that same app_id, so the running window is
  #   associated with firefly-studio.desktop instead of being an orphan icon in the dock
  icon: build/icons
  executableName: firefly-studio
  syncDesktopName: true
  # single main category -> no "might appear twice in menu" hint from desktop-file-validate
  category: Development
  desktop:
    entry:
      Name: Firefly Studio
      GenericName: Blog Configuration Editor
      Comment: Graphical editor for Firefly (Astro) blog configuration and posts
      Keywords: firefly;astro;blog;config;editor;markdown;frontmatter;
      StartupWMClass: firefly-studio
      Terminal: 'false'
